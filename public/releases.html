<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rodrick Hub — Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>📦 Rodrick Hub <span class="dim">— Versions</span></h1>
        <div class="subtitle">Historique des releases de RodrickBOT, changelog et téléchargement.</div>
      </div>
    </header>

    <nav class="hub-nav">
      <a href="index.html">Dashboard</a>
      <a href="releases.html" class="active">Versions</a>
      <a href="commands.html">Commandes</a>
      <a href="community.html">Communauté</a>
      <a href="stats.html">Statistiques</a>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="latestBanner"></div>

    <details class="publish-panel">
      <summary>➕ Publier une nouvelle version (admin)</summary>
      <div id="keyBar">
        <input id="apiKeyInput" type="password" placeholder="Clé API du dashboard" />
      </div>
      <form id="publishForm">
        <input id="fVersion" type="text" placeholder="Version (ex: 1.64.0)" required />
        <input id="fDate" type="date" required />
        <textarea id="fChangelog" placeholder="Changelog (une ligne par changement)" rows="4"></textarea>
        <input id="fDownloadUrl" type="text" placeholder="Lien de téléchargement (ex: downloads/rodrickbot-1.64.0.zip)" />
        <button type="submit">Publier</button>
      </form>
      <div id="publishError"></div>
    </details>

    <div id="error"></div>
    <div id="releasesList" class="release-list"></div>
    <div id="empty" style="display:none">Aucune version publiée pour le moment.</div>
  </div>

  <script src="js/releases.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
