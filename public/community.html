<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090c16" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Communauté</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>👥 Rodrick Hub <span class="dim">— Communauté</span></h1>
        <div class="subtitle">Annonces, nouveautés, guides et publications autour de RodrickBOT.</div>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="notifBanner" class="notif-banner" style="display:none"></div>

    <div class="category-pills" id="categoryPills"></div>

    <div id="error" class="form-error"></div>
    <div id="postsList" class="posts-list"></div>
    <div id="empty" style="display:none">Aucune publication pour le moment.</div>

    <!-- "Lecteur" : s'affiche par-dessus la liste quand on clique sur un post -->
    <div id="reader" class="reader" style="display:none">
      <button id="readerClose" class="reader-close">← Retour à la liste</button>
      <div class="reader-category" id="readerCategory"></div>
      <h2 id="readerTitle"></h2>
      <div class="reader-meta" id="readerMeta"></div>
      <div class="reader-content" id="readerContent"></div>
    </div>
  </div>

  <script src="js/community.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
