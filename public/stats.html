<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090c16" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Statistiques</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>📊 Rodrick Hub <span class="dim">— Statistiques</span></h1>
        <div class="subtitle">Chiffres agrégés du réseau RodrickBOT — aucun détail individuel.</div>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="error" class="form-error"></div>

    <div id="overviewCards" class="stats-cards"></div>

    <div class="stats-section">
      <h3>Nouveaux comptes Hub (30 derniers jours)</h3>
      <div id="userGrowthChart" class="bar-chart"></div>
    </div>

    <div class="stats-section">
      <h3>Instances actives par jour (30 derniers jours)</h3>
      <div id="activityChart" class="bar-chart"></div>
    </div>

    <div class="stats-section">
      <h3>Commandes les plus utilisées (toutes instances confondues)</h3>
      <div id="topCommandsChart" class="leaderboard"></div>
    </div>
  </div>

  <script src="js/stats.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
