<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#090c16" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Mot de passe oublié</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page page-narrow">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub <span class="dim">— Mot de passe oublié</span></h1>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <form id="forgotForm" class="auth-form">
      <p class="form-hint">Indique ton email — si un compte existe, tu recevras un lien pour choisir un nouveau mot de passe.</p>
      <input id="fEmail" type="email" placeholder="Adresse email" required autocomplete="email" />
      <button type="submit">Envoyer le lien</button>
      <div id="formError" class="form-error"></div>
      <div id="formSuccess" class="field-status field-status-success" style="display:none"></div>
    </form>

    <p class="auth-switch"><a href="login.html">Retour à la connexion</a></p>
  </div>

  <script src="js/forgot-password.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
