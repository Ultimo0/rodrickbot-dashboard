<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090c16" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Mot de passe oublié</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page page-narrow">
    <header class="page-header">
      <div>
        <h1>🔑 Rodrick Hub <span class="dim">— Mot de passe oublié</span></h1>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <form id="forgotForm" class="auth-form">
      <p class="form-hint">Indique ton email — si un compte existe, tu recevras un lien pour choisir un nouveau mot de passe.</p>
      <input id="fEmail" type="email" placeholder="Adresse email" required autocomplete="email" />
      <button type="submit">Envoyer le lien</button>
      <div id="formError" class="form-error"></div>
      <div id="formSuccess" class="field-status field-status-success" style="display:none"></div>
    </form>

    <p class="auth-switch"><a href="login.html">Retour à la connexion</a></p>
  </div>

  <script src="js/forgot-password.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
