<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#eae2cd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16110a" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page page-narrow auth-page">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub <span class="dim">— Connexion</span></h1>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6.5 8 6 8-6"/></svg></span>
        <input id="fEmail" type="email" placeholder="Adresse email" required autocomplete="email" />
      </div>
      <div class="field field-password">
        <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <input id="fPassword" type="password" placeholder="Mot de passe" required autocomplete="current-password" />
        <button type="button" id="togglePassword" class="field-toggle" aria-label="Afficher le mot de passe" aria-pressed="false"></button>
      </div>
      <button type="submit">Se connecter</button>
      <div id="formError" class="form-error"></div>
    </form>

    <p class="auth-switch"><a href="forgot-password.html">Mot de passe oublié ?</a></p>
    <p class="auth-switch">Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
  </div>

  <script src="js/login.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
