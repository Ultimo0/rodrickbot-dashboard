<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RodrickBOT — Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>🤖 RodrickBOT <span class="dim">— Dashboard</span></h1>
      <div class="subtitle">Suivi centralisé des copies distribuées du bot.</div>
    </header>

    <div id="keyBar">
      <input id="apiKeyInput" type="password" placeholder="Clé API du dashboard" />
      <button id="saveKeyBtn">Connexion</button>
    </div>

    <div id="error"></div>

    <div id="summary"></div>
    <div class="grid" id="grid"></div>
    <div id="empty" style="display:none">Aucune instance n'a encore envoyé de rapport.</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
