<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RodrickBOT — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>🤖 RodrickBOT <span class="dim">— Dashboard</span></h1>
        <div class="subtitle">Suivi centralisé des copies distribuées du bot.</div>
      </div>
      <div class="live-pill"><span class="dot"></span>Heartbeat en direct</div>
    </header>

    <div id="keyBar">
      <input id="apiKeyInput" type="password" placeholder="Clé API du dashboard" />
      <button id="saveKeyBtn">Connexion</button>
    </div>

    <div id="summonBar">
      <button id="summonBtn">🔥 Invoquer tous les RodrickBOT</button>
      <div class="summon-hint">Chaque copie en ligne enverra « Je m'incline devant votre sagesse, Seigneur. » dans tous ses groupes, depuis la chaîne officielle.</div>
    </div>

    <div id="error"></div>

    <div id="summary"></div>
    <div class="grid" id="grid"></div>
    <div id="empty" style="display:none">Aucune instance n'a encore envoyé de rapport.</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
