<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#090c16" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub</h1>
        <div class="subtitle">Suivi centralisé des copies distribuées de RodrickBOT.</div>
      </div>
      <div id="liveStatus" class="live-status">🔴 Connexion...</div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="keyBar">
      <input id="apiKeyInput" type="password" placeholder="Clé API du dashboard" />
      <button id="saveKeyBtn">Connexion</button>
    </div>

    <div id="error"></div>

    <div id="summary"></div>
    <div class="grid" id="grid"></div>
    <div id="empty" style="display:none">Aucune instance n'a encore envoyé de rapport.</div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
