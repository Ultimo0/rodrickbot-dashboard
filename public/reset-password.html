<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#090c16" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page page-narrow">
    <header class="page-header">
      <div>
        <h1>🔑 Rodrick Hub <span class="dim">— Nouveau mot de passe</span></h1>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks"></div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <form id="resetForm" class="auth-form">
      <input id="fPassword" type="password" placeholder="Nouveau mot de passe (8 caractères min.)" required autocomplete="new-password" minlength="8" />
      <button type="submit">Changer le mot de passe</button>
      <div id="formError" class="form-error"></div>
    </form>

    <div id="invalidToken" style="display:none">
      Ce lien est invalide ou a expiré. <a href="forgot-password.html">Demander un nouveau lien</a>.
    </div>
  </div>

  <script src="js/reset-password.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
