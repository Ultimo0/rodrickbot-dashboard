<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rodrick Hub — Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>🧩 Rodrick Hub <span class="dim">— Commandes</span></h1>
        <div class="subtitle">Catalogue complet des commandes de RodrickBOT.</div>
      </div>
    </header>

    <nav class="hub-nav">
      <a href="index.html">Dashboard</a>
      <a href="releases.html">Versions</a>
      <a href="commands.html" class="active">Commandes</a>
      <a href="community.html">Communauté</a>
      <a href="stats.html">Statistiques</a>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Rechercher une commande..." />
      <div id="categoryPills" class="category-pills"></div>
    </div>

    <div id="error"></div>
    <div id="commandsList" class="commands-list"></div>
    <div id="empty" style="display:none">Aucune commande ne correspond à ta recherche.</div>
  </div>

  <script src="js/commands.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
