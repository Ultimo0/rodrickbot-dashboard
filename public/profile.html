<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('rodrick_hub_theme') || 'classique');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rodrick Hub — Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page page-narrow">
    <header class="page-header">
      <div>
        <h1>👤 Rodrick Hub <span class="dim">— Profil</span></h1>
      </div>
    </header>

    <nav class="hub-nav">
      <a href="index.html">Dashboard</a>
      <a href="releases.html">Versions</a>
      <a href="commands.html">Commandes</a>
      <select id="themeSwitcher" class="theme-switcher">
        <option value="classique">Classique</option>
        <option value="royal">Royal</option>
        <option value="neon">Neon</option>
        <option value="mono">Mono</option>
      </select>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="notLoggedIn" style="display:none">
      Tu n'es pas connecté(e). <a href="login.html">Se connecter</a>
    </div>

    <div id="profileCard" class="profile-card" style="display:none">
      <div class="profile-row"><span class="profile-label">Nom</span><span id="pName"></span></div>
      <div class="profile-row"><span class="profile-label">Email</span><span id="pEmail"></span></div>
      <div class="profile-row"><span class="profile-label">Rôle</span><span id="pRole" class="role-badge"></span></div>
      <div class="profile-row"><span class="profile-label">Membre depuis</span><span id="pSince"></span></div>
      <button id="logoutBtn">Se déconnecter</button>
    </div>
  </div>

  <script src="js/profile.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
